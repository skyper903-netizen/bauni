<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kya Aap Buni Ho?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Night Sky Background */
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 50%, #16213e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Moon */
        .moon {
            position: absolute;
            top: 50px;
            right: 80px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff9c4 0%, #ffeb3b 50%, #fdd835 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffeb3b, 0 0 80px #fff59d;
            z-index: 1;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #1a237e;
            font-size: 32px;
            margin-bottom: 50px;
            font-weight: 600;
        }

        .btn {
            padding: 20px 50px;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #yesBtn {
            background: linear-gradient(45deg, #1a237e, #3949ab);
            color: white;
            box-shadow: 0 5px 20px rgba(26, 35, 126, 0.4);
        }

        #noBtn {
            background-color: #333;
            color: white;
            position: absolute;
            left: 70%;
            top: 65%;
        }

        /* Success Interface with Laugh Emoji */
        #successInterface {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Night sky for success too */
            background: linear-gradient(to bottom, #0f0c29 0%, #302b63 50%, #24243e 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #successInterface .laugh-emoji {
            font-size: 150px;
            animation: laughBounce 0.5s infinite alternate;
            margin-bottom: 20px;
        }

        #successInterface h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        #successInterface p {
            color: #1a237e;
            font-size: 28px;
            font-weight: 600;
            padding: 15px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @keyframes laughBounce {
            0% { transform: scale(1) rotate(-10deg); }
            100% { transform: scale(1.1) rotate(10deg); }
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.9; background: white; }
            100% { opacity: 0; }
        }

        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
            pointer-events: none;
            animation: flash 0.5s forwards;
        }

        .shooting-star {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(to right, white, transparent);
            animation: shoot 1s linear forwards;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translateX(0) rotate(-45deg); opacity: 1; }
            100% { transform: translateX(500px) rotate(-45deg); opacity: 0; }
        }

        .heart {
            position: absolute;
            font-size: 30px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Stars Background -->
    <div class="stars" id="stars"></div>
    
    <!-- Moon -->
    <div class="moon"></div>

    <!-- Main Game Interface -->
    <div class="container" id="gameContainer">
        <h1>kya aap bauni ho ❤️</h1>
        <button id="yesBtn" class="btn" onclick="acceptLove()">Yes</button>
        <button id="noBtn" class="btn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">No</button>
    </div>

    <!-- Success Interface with Laugh Emoji -->
    <div id="successInterface">
        <div class="laugh-emoji">😂</div>
        <h1>Congratulations! 🎉</h1>
        <p>आपने Accept कर लिया है! ❤️</p>
    </div>

    <script>
        // Get elements
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const gameContainer = document.getElementById('gameContainer');
        const successInterface = document.getElementById('successInterface');
        const starsContainer = document.getElementById('stars');

        // Track how many times No button was clicked
        let noClickCount = 0;
        let yesScale = 1;

        // Create stars background
        function createStars() {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // Function to move No button and increase Yes button size
        function moveNoBtn() {
            noClickCount++;
            
            // Move No button to random position anywhere in window
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 60;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            
            // Increase Yes button size every time No is clicked
            yesScale = 1 + (noClickCount * 0.15);
            yesBtn.style.transform = 'scale(' + yesScale + ')';
            yesBtn.style.padding = (20 + noClickCount * 3) + 'px ' + (50 + noClickCount * 5) + 'px';
            
            // Keep buttons on top
            yesBtn.style.zIndex = '999';
            noBtn.style.zIndex = '1000';
        }

        // Function when Yes is clicked
        function acceptLove() {
            // Hide game
            gameContainer.style.display = 'none';
            
            // Show success with laugh emoji
            successInterface.style.display = 'flex';
            
            // Flash effect
            createFlash();
            
            // Start hearts
            setInterval(createHeart, 150);
            
            // Shooting stars
            setInterval(createShootingStar, 800);
        }

        function createFlash() {
            const flash = document.createElement('div');
            flash.className = 'flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            heart.style.fontSize = (Math.random() * 25 + 25) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = Math.random() * 50 + 'vw';
            shootingStar.style.top = Math.random() * 50 + 'vh';
            document.body.appendChild(shootingStar);
            setTimeout(() => shootingStar.remove(), 1000);
        }
    </script>
</body>
</html>
